
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-5">

<div class="w-full max-w-2xl rounded-3xl border border-white/10 bg-slate-900 p-6 md:p-10 shadow-2xl">

    <div class="mb-8">
        <div class="mb-3 flex items-center gap-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-2xl">
                🔊
            </div>
            <div>
                <h1 class="text-2xl font-bold">Text to Speech</h1>
                <p class="text-sm text-slate-400">Convert your text into speech</p>
            </div>
        </div>
    </div>

    <div class="space-y-5">

        <!-- Text -->
        <div>
            <div class="mb-2 flex justify-between">
                <label class="text-sm font-semibold">Your Text</label>
                <span id="charCount" class="text-xs text-slate-400">0 characters</span>
            </div>

            <textarea
                id="textInput"
                rows="6"
                placeholder="Type something you want to hear..."
                class="w-full resize-none rounded-2xl border border-white/10 bg-slate-800 p-4 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
            ></textarea>
        </div>

        <!-- Voice -->
        <div>
            <label class="mb-2 block text-sm font-semibold">Voice</label>
            <select
                id="voiceSelect"
                class="w-full rounded-xl border border-white/10 bg-slate-800 p-3 text-sm outline-none focus:border-indigo-500"
            ></select>
        </div>

        <!-- Settings -->
        <div class="grid grid-cols-2 gap-4">

            <div>
                <label class="mb-2 block text-sm font-semibold">
                    Speed <span id="rateValue" class="text-indigo-400">1x</span>
                </label>
                <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"
                    class="w-full accent-indigo-500">
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold">
                    Pitch <span id="pitchValue" class="text-indigo-400">1</span>
                </label>
                <input id="pitch" type="range" min="0" max="2" step="0.1" value="1"
                    class="w-full accent-indigo-500">
            </div>

        </div>

        <!-- Actions -->
        <div class="grid grid-cols-3 gap-3 pt-3">

            <button id="playBtn"
                class="rounded-xl bg-indigo-600 px-4 py-3 font-semibold transition hover:bg-indigo-500 active:scale-95">
                ▶ Play
            </button>

            <button id="pauseBtn"
                class="rounded-xl bg-slate-700 px-4 py-3 font-semibold transition hover:bg-slate-600">
                ⏸ Pause
            </button>

            <button id="stopBtn"
                class="rounded-xl bg-rose-600/20 px-4 py-3 font-semibold text-rose-400 transition hover:bg-rose-600/30">
                ■ Stop
            </button>

        </div>

        <!-- Status -->
        <div class="rounded-xl bg-slate-800 p-4">
            <div class="flex items-center gap-2">
                <span id="statusDot" class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
                <p id="status" class="text-sm text-slate-400">Ready to speak</p>
            </div>
        </div>

    </div>
</div>

<script src="./asset/js/file.js"></script>


</body>
</html>
